
[project]
name = "ingen-robot-telemetry"
version = "0.2.0"
description = "Synthetic robot fleet telemetry and predictive health"
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
    "duckdb>=1.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.8",
    "mlflow>=3.18.0",
    "pandas>=3.1.0",
    "pyarrow>=26.0.1",
    "python-docx>=1.2.0",
    "pytz>=2026.6",
    "PyYAML>=6.0",
    "scikit-learn>=1.9.1",
    "torch>=2.15.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.10",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingen_fleet_health"]

[tool.uv]
package = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.mypy]
ignore_missing_imports = true
