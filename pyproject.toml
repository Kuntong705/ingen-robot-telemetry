
[project]
name = "ingen-robot-telemetry"
version = "0.1.0"
description = "Synthetic robot fleet telemetry and predictive health"
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
    "duckdb>=1.0",
    "matplotlib>=3.8",
    "pytz>=2026.6",
    "PyYAML>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.10",
    "mypy>=1.10",
]

[tool.uv]
package = false
